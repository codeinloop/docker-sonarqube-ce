name: sonarqube-ce

x-arcane:
  icon: sonarqube
  icon-light: sonarqube
  icon-dark: sonarqube
  urls:
    - https://${SONAR_DOMAIN}
    - https://docs.sonarsource.com/sonarqube-server/10.8/setup-and-upgrade/install-the-server/installing-the-database
    - https://github.com/mc1arke/sonarqube-community-branch-plugin
    - https://docs.sonarsource.com/sonarqube-mcp-server/
  tags:
    - name: code-quality
      color: blue
    - name: database
      color: purple
    - name: devtools
      color: green
    - name: mcp
      color: orange

services:
  sysctl:
    image: busybox:1.37
    container_name: sonarqube-sysctl
    privileged: true
    command:
      - sh
      - -c
      - |
        set -e
        ensure() {
          cur=$$(sysctl -n "$$1")
          if [ "$$cur" -lt "$$2" ]; then
            sysctl -w "$$1=$$2"
          else
            echo "$$1=$$cur ja atende o minimo $$2, mantido"
          fi
        }
        ensure vm.max_map_count 524288
        ensure fs.file-max 131072
    restart: "no"
    labels:
      arcane.icon: linux

  db:
    image: postgres:17-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sonarnet
    labels:
      arcane.icon: postgresql

  sonarqube:
    build:
      context: .
      args:
        SONARQUBE_VERSION: ${SONARQUBE_VERSION}
        PLUGIN_VERSION: ${PLUGIN_VERSION}
    image: sonarqube-ce-branch:${PLUGIN_VERSION}
    pull_policy: build
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      sysctl:
        condition: service_completed_successfully
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      SONAR_CORE_SERVERBASEURL: https://${SONAR_DOMAIN}
    ports:
      - "${SONAR_BIND:-127.0.0.1}:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - sonarnet
      - dockroute_network
    labels:
      arcane.icon-light: sonarqube
      arcane.icon-dark: sonarqube
      arcane.icon: sonarqube
      dockroute.enabled: "true"
      dockroute.hostname: "${SONAR_DOMAIN}"
      dockroute.tunnel.service: "http://sonarqube:9000"

  # [VIDEO - PARTE 5] MCP Server: deixa agentes de IA (Claude Code, Cursor, Copilot...)
  # consultarem issues, hotspots, quality gates e regras deste SonarQube.
  # A doc "SonarQube Server-hosted" (sonar.mcp.* + proxy em <sonar>/mcp) vale so para as
  # edicoes comerciais: o Community Build nao tem essas propriedades. Por isso o MCP roda
  # como container proprio, em modo HTTP, e ganha o seu proprio hostname no tunnel.
  mcp:
    image: sonarsource/sonarqube-mcp:${MCP_VERSION}
    container_name: sonarqube-mcp
    init: true
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      # Fala com o SonarQube pela rede interna, sem dar a volta pelo Cloudflare.
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TRANSPORT: http
      # 0.0.0.0 e so o bind DENTRO do container; quem decide a exposicao e "ports" e o tunnel.
      SONARQUBE_HTTP_HOST: 0.0.0.0
      SONARQUBE_HTTP_PORT: 8080
      # Sem SONARQUBE_TOKEN aqui de proposito: o servidor e stateless e cada cliente manda
      # o proprio user token em "Authorization: Bearer ...". Ninguem herda credencial do host.
      # Origens de navegador permitidas (CORS). So importa para clientes web, nao para CLIs.
      SONARQUBE_HTTP_ALLOWED_ORIGINS: https://${MCP_DOMAIN}
      TELEMETRY_DISABLED: ${MCP_TELEMETRY_DISABLED:-false}
    volumes:
      # STORAGE_PATH padrao da imagem (/app/storage, ja criado e pertencente ao appuser).
      # Montar o volume nesse caminho herda a permissao certa no primeiro boot.
      - mcp_data:/app/storage
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    healthcheck:
      # A imagem e alpine sem curl; o wget do busybox falha em HTTP != 2xx.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      # sonarnet: alcanca o SonarQube. dockroute_network: e onde o cloudflared o alcanca.
      - sonarnet
      - dockroute_network
    labels:
      arcane.icon: sonarqube
      arcane.icon-light: sonarqube
      arcane.icon-dark: sonarqube
      # Hostname proprio no tunnel. O endpoint para os agentes e https://${MCP_DOMAIN}/mcp.
      dockroute.enabled: "true"
      dockroute.hostname: "${MCP_DOMAIN}"
      dockroute.tunnel.service: "http://sonarqube-mcp:8080"

volumes:
  postgres_data:
  sonarqube_extensions:
  sonarqube_data:
  sonarqube_logs:
  mcp_data:

networks:
  sonarnet:
    internal: true
  dockroute_network:
    external: true
    name: dockroute_codeinloop_default
